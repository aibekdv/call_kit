name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  dart:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run format-check
      - run: melos run analyze
      - run: melos run test

  android:
    name: Build Android example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      # The analyzer never sees Kotlin, so the only check on the native half is
      # building it.
      - run: flutter build apk --debug
        working-directory: packages/call_native_kit/example
      # And the combined example is the widest link check there is: all three
      # packages plus LiveKit and WebRTC in one binary.
      - run: flutter build apk --debug
        working-directory: example

  ios:
    name: Build iOS example
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate melos
      - run: melos bootstrap
      # Likewise for Swift.
      - run: flutter build ios --debug --no-codesign
        working-directory: packages/call_native_kit/example
      - run: flutter build ios --debug --no-codesign
        working-directory: example
