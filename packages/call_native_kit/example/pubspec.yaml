name: call_native_kit_example
description: "Manual test rig for call_native_kit: push simulator, system call UI, picture-in-picture and audio-session diagnostics."
publish_to: 'none'

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Resolved from this workspace — no path dependency to keep in sync.
  call_native_kit: any
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
